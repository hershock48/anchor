<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>demo og card source</title>
<!--
  Source page for public/og.jpg, the DEMO card. This is the client's own card,
  not Glazed's: it wears her brand entirely and says what the business is.
  The mark is her actual artwork (public/brand/anchor-mark.png, referenced
  relatively so a file:// render finds it), on the paper ground the artwork
  was made for.

  Screenshot at 1200x630, 1x. Everything that must be read sits inside the
  centre 630x630 band, x 285 to x 915, because iOS crops toward square.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #F7F3EC; color: #122C4E;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .wash { position: absolute; inset: 0;
    background: radial-gradient(circle at 12% 20%, rgba(198,159,88,.16), transparent 45%); }
  .safe { position: relative; z-index: 2; width: 630px; height: 630px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 6px; }
  .name { font-size: 54px; font-weight: 700; letter-spacing: .1em; line-height: 1.1;
    margin-top: 24px; text-transform: uppercase; }
  .rule { width: 84px; height: 3px; background: #C69F58; margin: 20px 0 16px; }
  .tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px;
    letter-spacing: .2em; text-transform: uppercase; color: #6F5415; font-weight: 600; }
  .where { margin-top: 24px; font-size: 25px; color: #4D5A66; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="safe">
    <img src="../public/brand/anchor-mark.png" width="196" height="232" alt="">
    <p class="name">Anchor Insurance</p>
    <div class="rule"></div>
    <p class="tag">Coverage that gives back</p>
    <p class="where">Independent agency &middot; Manchester, Michigan</p>
  </div>
</body>
</html>

<!DOCTYPE html>

<title>demo og card source</title>
<!--
  Source page for public/og.jpg, the DEMO card. This is the client's own card,
  not Glazed's: link-cards.md is explicit that a pitch host serves two, and that
  getting them backwards is the most common mistake. The proposal card wears
  Glazed's argument in Glazed's colors and asks a question. This one wears her
  brand entirely and says what the business is, because the demo is a full copy
  of her site and should look like it everywhere, including here.

  Screenshot at 1200x630, 1x. Everything that must be read sits inside the
  centre 630x630 band, x 285 to x 915, because iOS crops toward square.
-->
<style>

  html, body { width: 1200px; height: 630px; }
  body {

    background: #14293C; color: #fff;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;

  .wash { position: absolute; inset: 0;
    background: radial-gradient(circle at 12% 20%, rgba(196,54,43,.28), transparent 45%); }
  .safe { position: relative; z-index: 2; width: 630px; height: 630px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 6px; }
  .name { font-size: 62px; font-weight: 700; letter-spacing: -2px; line-height: 1.04; margin-top: 26px; }
  .rule { width: 84px; height: 3px; background: #E4614F; margin: 22px 0 18px; }
  .tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 21px;
    letter-spacing: .2em; text-transform: uppercase; color: #F0A093; font-weight: 600; }
  .where { margin-top: 26px; font-size: 26px; color: #C8D4DE; }
</style>

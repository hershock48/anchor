<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FULL BLEED, NO CORNER RADIUS.
       The first version was a rounded rect, which baked pure white into the four
       corners of the PNG. On any tab or launcher background that is not white
       that reads as a white frame around a blue blob. It also double-rounds on
       iOS, which applies its own mask to an apple-touch-icon and expects a full
       square to mask.
       The geometry is the client's logo as drawn in components/Logo.tsx: white
       anchor, gold wave over it. Nudged up because the anchor's visual mass
       sits low, so a geometric centre reads as sitting too high. -->
  <rect width="512" height="512" fill="#14293C"/>
  <g transform="translate(82 32) scale(2.9)">
    <circle cx="60" cy="19.5" r="10" fill="none" stroke="#FFFFFF" stroke-width="7.5"/>
    <path d="M60 32 L60 116" stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round" fill="none"/>
    <path d="M28 51 L92 51" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="26" cy="51" r="6.2" fill="#FFFFFF"/>
    <circle cx="94" cy="51" r="6.2" fill="#FFFFFF"/>
    <path d="M17 86 C21 112 37 127 60 127 C83 127 99 112 103 86" stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round" fill="none"/>
    <path d="M8 94 L15 62 L30 87 Q19 82 8 94 Z" fill="#FFFFFF"/>
    <path d="M112 94 L105 62 L90 87 Q101 82 112 94 Z" fill="#FFFFFF"/>
    <path d="M6 90 C22 76 40 76 57 88 C74 100 92 100 114 84" stroke="#C19A49" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M10 103 C26 91 44 91 60 101 C76 111 92 111 110 97" stroke="#A8813A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M22 114 C36 105 52 105 65 111 C77 117 90 117 102 110" stroke="#C19A49" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>

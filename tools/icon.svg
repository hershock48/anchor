<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FULL BLEED, NO CORNER RADIUS.
       The first version was a rounded rect, which baked pure white into the four
       corners of the PNG. On any tab or launcher background that is not white
       that reads as a white frame around a blue blob. It also double-rounds on
       iOS, which applies its own mask to an apple-touch-icon and expects a full
       square to mask.
       The anchor is nudged up 8px because its visual mass sits low, so a
       geometric centre reads as sitting too high. -->
  <rect width="512" height="512" fill="#14293C"/>
  <g transform="translate(112 68) scale(2.4)">
    <path d="M60 45 C60 45 38.5 32.5 38.5 19.5 C38.5 11.6 44.6 5.4 52.3 5.4 C56.3 5.4 59 7.5 60 10.2 C61 7.5 63.7 5.4 67.7 5.4 C75.4 5.4 81.5 11.6 81.5 19.5 C81.5 32.5 60 45 60 45 Z"
      fill="none" stroke="#E4614F" stroke-width="11" stroke-linejoin="round"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 47 L60 122"/>
      <path d="M30 62 L90 62"/>
      <path d="M20 83 C20 111 38 127 60 127 C82 127 100 111 100 83"/>
    </g>
  </g>
</svg>

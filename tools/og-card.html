<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card source</title>
<!--
  Source page for public/pitch/anchor/og.jpg, the PROPOSAL's link card: what
  shows when anchor.glazedweb.com is pasted into a text.

  REDRAWN 29 SEPTEMBER 2026, at Kevin's word, IN HER IDENTITY. It used to wear
  the studio's: cream, raspberry, the glazed mark, which is the convention in
  glaze/proposal.md (the proposal's card is the studio's, the site's card is
  the client's). This one departs from that on purpose. The link she is sent
  is this one, and the first thing she sees should be what she is being
  offered, not who is offering it. The studio is still named, in the last line
  of the card, because a proposal that hides its author is a worse kind of
  wrong.

  Same ground, lights and pane as the site's card (tools/demo-og-card.html)
  and the homepage hero, so the three cannot be told apart at a glance. Her
  mark is the reversed cut, because the ground is dark.

  THE FONTS come from Google at render time, which is fine for a page rendered
  once into a JPEG. The render refuses to take the picture if one is missing.

  Everything that must be read sits inside the centre 630x630 band, x 285 to
  x 915. Newer iOS crops link previews toward square and the outer 285px on
  each side can simply vanish. Screenshot at 1200x630, 1x.

  AFTER RE-RENDERING, BUMP THE ?v= on og:image in
  public/pitch/anchor/index.html. A card is cached by its URL for weeks.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;900&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Archivo", sans-serif;
    background: #0B2140; color: #fff;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .orb { position: absolute; border-radius: 50%; opacity: .62;
    background: radial-gradient(closest-side, var(--c) 0%, var(--c) 28%, transparent 100%); }
  .o1 { --c: #FF7A59; width: 620px; height: 620px; left: -200px; top: -260px; }
  .o2 { --c: #3DD6C1; width: 520px; height: 520px; left: 40px;  bottom: -330px; }
  .o3 { --c: #B9A6F7; width: 460px; height: 460px; left: 470px; top: -330px; }
  .o4 { --c: #6EC1F2; width: 560px; height: 560px; right: -120px; top: -290px; }
  .o5 { --c: #E3B24E; width: 620px; height: 620px; right: -230px; bottom: -340px; }

  .safe { position: relative; z-index: 2; width: 630px; height: 630px;
    display: flex; align-items: center; justify-content: center; }
  .pane {
    width: 590px; padding: 38px 30px 30px; border-radius: 34px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    background:
      linear-gradient(135deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 46%, rgba(255,255,255,.05) 100%),
      rgba(11, 33, 64, .62);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255,255,255,.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08), 0 34px 70px -34px rgba(0,0,0,.65);
  }
  .kicker { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 19px;
    letter-spacing: .24em; text-transform: uppercase; color: #F2DCA8; padding-left: .24em; }
  /* 62px, not larger: the longest line has to clear both edges of the 630
     square crop with room to spare, which is the failure the old card's
     comment recorded at 74px. */
  h1 { font-weight: 900; font-size: 62px; letter-spacing: -0.045em; line-height: 1.0; margin-top: 20px; }
  /* Gold as TEXT is allowed here and nowhere on the site's light grounds: on
     the smoked pane it measures above 8. */
  h1 em { font-style: normal; color: #E3B24E; }
  .for { display: flex; align-items: center; gap: 14px; margin-top: 30px; }
  .for .name { font-weight: 900; font-size: 50px; letter-spacing: -0.055em; line-height: 1; }
  .for .trade { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 15px;
    letter-spacing: .2em; text-transform: uppercase; color: #cbd7e1; padding-top: 16px; }
  .from { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 14px;
    letter-spacing: .16em; text-transform: uppercase; color: #cbd7e1; margin-top: 24px; }
</style>
</head>
<body>
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span><span class="orb o5"></span>
  <div class="safe">
    <div class="pane">
      <p class="kicker">A website proposal</p>
      <h1>Let’s build<br>something that<br><em>stands out.</em></h1>
      <div class="for">
        <img src="../public/brand/anchor-mark-reverse.png" width="62" height="73" alt="">
        <span class="name">anchor</span>
        <span class="trade">insurance</span>
      </div>
      <p class="from">A proposal from glazedweb</p>
    </div>
  </div>
</body>
</html>
